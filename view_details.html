<!DOCTYPE html>
<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>View Details | ktaby</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <!-- Navigation Bar -->
        <nav class="navbar">
            <ul>

                <li><a href="borrow.html">Borrow New Book</a></li>

            </ul>

        <!-- Book Details Section -->
        <div class="book-details-container">
            <div class="book-cover">
                <img id="book-image" src="" alt="Book Cover">
            </div>
            <div class="book-info">
                <h2 id="book-title">Book Title</h2>
                <p><strong>Author:</strong> <span id="book-author"></span></p>
                <p><strong>Category:</strong> <span id="book-category"></span></p>
                <p><strong>Description:</strong> <span id="book-description"></span></p>
                <button id="borrow-btn" class="btn">Borrow</button>
            </div>
        </div>
        
        <script src="scripts.js"></script>
